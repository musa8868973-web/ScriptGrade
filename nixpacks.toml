# Nixpacks build plan for the ScriptGrade monorepo.
#
# Railway builds from the repo ROOT, where Nixpacks cannot auto-detect Python:
# there is no requirements.txt / main.py / pyproject.toml at the top level (the
# FastAPI app lives in backend/). Without help this produced:
#   /bin/bash: line 1: python: command not found
#
# Fix: FORCE the Python provider so a virtualenv is provisioned at /opt/venv and
# placed on PATH, then install the backend dependencies explicitly from
# backend/requirements.txt in the build phase.

# Force the Python provider; '...' keeps any other auto-detected providers.
providers = ['...', 'python']

[variables]
# backend/requirements.txt targets Python 3.11+.
NIXPACKS_PYTHON_VERSION = '3.11'
# The provider's default installer expects requirements.txt at the ROOT (absent
# here), so skip it and install from backend/ in the build phase below.
NIXPACKS_PYTHON_PACKAGE_MANAGER = 'skip'

[phases.build]
# Run after 'setup' (which provisions Python + the /opt/venv on PATH).
dependsOn = ['setup']
cmds = ['pip install -r backend/requirements.txt']

[start]
# $PORT is injected by Railway at runtime; --app-dir puts backend/ on sys.path.
cmd = 'uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend'
