# Nixpacks build plan for the ScriptGrade backend.
#
# Railway's service Root Directory is `backend/`, so Nixpacks runs from here:
# Python is auto-detected via the requirements.txt at this level, the provider
# is forced explicitly for determinism, and dependencies are installed relative
# to THIS directory (no backend/ prefix anywhere).

# Force the Python provider; '...' keeps any other auto-detected providers.
providers = ['...', 'python']

[variables]
# requirements.txt targets Python 3.11+.
NIXPACKS_PYTHON_VERSION = '3.11'
# Installation is done in the build phase below, so keep the provider's own
# auto-install disabled.
NIXPACKS_PYTHON_PACKAGE_MANAGER = 'skip'

[phases.setup]
# Provision pip explicitly: the nixpkgs Python derivation ships WITHOUT pip,
# which is why the build phase died with "pip: command not found" / "No module
# named pip". Adding the matching pip package puts it on PATH for every later
# phase. Pinned to python311 to mirror NIXPACKS_PYTHON_VERSION — plain
# 'python3' would drag in nixpkgs' default (3.12+) and shadow the venv.
nixPkgs = ['python311', 'python311Packages.pip']

[phases.build]
# Run after 'setup' (which provisions Python + the /opt/venv on PATH).
dependsOn = ['setup']
cmds = ['python -m pip install -r requirements.txt']

[start]
# $PORT is injected by Railway at runtime. The working directory IS backend/
# (the service Root Directory), so `app.main:app` resolves here directly; no
# --app-dir is needed (that flag caused "No module named 'app'").
cmd = 'uvicorn app.main:app --host 0.0.0.0 --port $PORT'
